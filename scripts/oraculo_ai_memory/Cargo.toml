[package]
name = "oraculo-ai-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Oraculo de paridade: as funcoes puras do ai-memory (MIT, Fabio Akita), copiadas literalmente, para conferir o porte em Python."

[dependencies]
ai-memory-core = { path = "shim_core" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace]
