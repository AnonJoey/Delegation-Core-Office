# English descriptions of the alert rules (vigia.regras_padrao), rendered into
# docs/reference/alerts.md. Each one was written from the rule's function in vigia.py.

[indice_atrasado]
description = "More than `alerta_indice_atrasado` notes changed and were not reindexed."

[saude_do_vault]
description = "More than 5 notes marked for repair, any broken wikilink, or any note whose frontmatter cannot be read."

[agenda_falhando]
description = "A scheduled task failed twice or more in a row."

[sentinela_esquecida]
description = "A sentinel file that turns a behavior off (`no_auto_reindex` in `~/.delegation_core`) is still there."

[inbox_parado]
description = "Files have been in the vault's `_inbox/` for more than 24 hours without maintenance processing them."

[processo_parado]
description = "An active tracked process has had no update for `alerta_processo_parado_dias` days."

[disco]
description = "The vault's disk has less than 5 GB or less than 5% free."

[segredo_no_vault]
description = "A note changed in the last 2 days contains something that looks like a secret (API key, token, private key)."

[grafo_desatualizado]
description = "A code graph of a git repository was built 5 or more commits before the repository's HEAD (for a graph of a subfolder, only commits that touch it count)."
