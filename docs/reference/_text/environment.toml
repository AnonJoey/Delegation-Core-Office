# English descriptions of the environment variables the code reads, rendered into
# docs/reference/environment.md. Each one was written from the line that reads it.

[DELEGATION_CORE_COMPRESS_WORKERS]
description = "Worker processes for output compression, so it never holds the daemon's event loop. Default: half the CPUs, at most 4. `0` compresses in a thread of the daemon instead."

[DELEGATION_CORE_GRAPH_REBUILD_MEMORY_LIMIT_MB]
description = "Memory cap, in MB, for the background graph rebuild started by the git post-commit hook (Linux and macOS). Unset: no cap. The rebuild always runs at lower priority."

[DELEGATION_CORE_HOME]
description = "Folder of the DAG run history (`dag_executions.db`) kept by `dag_run`. Default `~/.delegation_core`. The rest of the program's state always lives in `~/.delegation_core`."

[DELEGATION_CORE_SKILLS_DB]
description = "Path of the skills catalog. Default `~/.delegation_core/skills.db`."

[DELEGATION_CORE_TOKEN]
description = "Not read by the daemon: it is the variable Codex is configured to read the bearer token from (`bearer_token_env_var`). Export the server token in it for Codex to connect."
